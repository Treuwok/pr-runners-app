[package]
name = "pr-runners-core"
description = "runner 監控的核心：GitHub HTTP 用戶端、端點對應、輪詢排程、Snapshot 組裝、認證。不依賴 Tauri。"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
keyring-core = "1"
pr-runners-rules = { path = "../rules", features = ["ts"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde.workspace = true
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ts-rs.workspace = true
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
wiremock = "0.6.5"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# 用不到搜尋功能：關掉預設的 search（它會帶進約 1 MB 的 regex）
windows-native-keyring-store = { version = "1", default-features = false }
