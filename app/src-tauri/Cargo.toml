[package]
name = "pr-runners-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "pr-runners 的桌面／行動外殼（Tauri 2）：背景輪詢、commands、選單列。畫面在 ../src。"

[lib]
# 名稱要和 bin 不同（Windows 上會衝突）；Android 需要 cdylib。
name = "pr_runners_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
pr-runners-core = { path = "../../crates/core" }
pr-runners-rules = { path = "../../crates/rules" }
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
ts-rs.workspace = true
url = "2"
